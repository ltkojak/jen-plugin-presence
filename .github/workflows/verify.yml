name: Verify

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ruff is pinned to the exact version jen-kea's CI pins: the bundled
      # copy of this plugin is linted and format-checked there with the
      # same ruff.toml, and `ruff format` output shifts between releases.
      - name: Install lint/template tooling
        run: pip install ruff==0.16.6 jinja2

      - name: ruff check
        run: ruff check plugin.py tools/verify.py tools/test_plugin.py

      - name: ruff format --check
        run: ruff format --check plugin.py tools/verify.py tools/test_plugin.py

      - name: Verify manifest, changelog, templates (CSP), and plugin.zip
        run: python tools/verify.py

      - name: Plugin unit checks (pure functions, no Jen or database needed)
        run: python tools/test_plugin.py
